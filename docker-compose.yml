version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: recruitment_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root_fallback}
      MYSQL_DATABASE: ${MYSQL_DB:-recruitment_db}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root_fallback}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "$${MYSQL_USER}", "-p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: recruitment_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root_fallback}
      MYSQL_DB: ${MYSQL_DB:-recruitment_db}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev_secret_key_change_in_prod}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Set mincached to 0 for graceful startup resilience
      DB_MIN_CACHED: 0 
    volumes:
      - ./uploads:/app/uploads

volumes:
  db_data:
