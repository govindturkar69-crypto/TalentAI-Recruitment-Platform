{% extends "base.html" %}

{% block title %}Internal Server Error{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height:60vh;padding:40px 20px">
  <div style="width:80px;height:80px;border-radius:20px;background:var(--danger-tint);display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--danger);margin-bottom:24px">
    <i class="bi bi-shield-x"></i>
  </div>
  <div style="font-size:5rem;font-weight:900;letter-spacing:-4px;color:var(--danger);line-height:1;margin-bottom:16px">500</div>
  <h2 style="font-weight:700;margin-bottom:12px">Something went wrong</h2>
  <p class="text-muted" style="max-width:420px;line-height:1.6;margin-bottom:28px">
    We encountered an unexpected error. Our team has been notified.
    Please try again in a moment.
  </p>
  <a href="{{ url_for('index') }}" class="saas-btn-primary text-decoration-none px-5 py-2" style="font-size:0.95rem">
    <i class="bi bi-house me-1"></i> Return to Home
  </a>
</div>
{% endblock %}
