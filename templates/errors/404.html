{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 fw-bold text-primary">404</h1>
    <h2 class="mb-4">Page Not Found</h2>
    <p class="lead text-muted mb-5">The page you are looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">Return to Home</a>
</div>
{% endblock %}
