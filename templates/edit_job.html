{% extends "base.html" %}
{% block title %}Edit Job{% endblock %}

{% block content %}
<div class="ats-hero-header mb-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <a href="{{ url_for('recruiter.recruiter_dashboard') }}" class="text-muted text-decoration-none small fw-semibold">
      <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
    </a>
  </div>
  <h2 class="mb-1" style="font-weight: 800; letter-spacing: -0.5px;">Edit Job</h2>
  <p class="text-muted mb-0">Update the details for "{{ job.job_title }}"</p>
</div>

<div class="row">
  <div class="col-lg-8">
    <div class="ats-form-panel">
      <form method="POST" action="{{ url_for('recruiter.edit_job', job_id=job.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <div class="ats-form-section">
          <h5 class="ats-form-title">Job Details</h5>
          
          <div class="mb-4">
            <label class="form-label fw-semibold">Job Title *</label>
            <input type="text" name="job_title" class="form-control saas-input border" style="border-color: var(--border-color) !important;"
                   value="{{ job.job_title }}" required>
          </div>
          
          <div class="mb-0">
            <label class="form-label fw-semibold">Job Description</label>
            <textarea name="description" class="form-control saas-input border" style="border-color: var(--border-color) !important;" rows="4">{{ job.description or '' }}</textarea>
          </div>
        </div>

        <div class="ats-form-section">
          <h5 class="ats-form-title">Location & Experience</h5>
          <div class="row g-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Location</label>
              <input type="text" name="location" class="form-control saas-input border" style="border-color: var(--border-color) !important;" value="{{ job.location or '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Experience Required</label>
              <select name="experience" class="form-select saas-input border" style="border-color: var(--border-color) !important;">
                {% for exp in ["Fresher", "1-2 years", "2-4 years", "4-6 years", "6+ years"] %}
                  <option value="{{ exp }}" {% if job.experience == exp %}selected{% endif %}>{{ exp }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
        </div>

        <div class="ats-form-section">
          <h5 class="ats-form-title">Requirements</h5>
          <div class="mb-0">
            <label class="form-label fw-semibold">Required Skills *</label>
            <input type="text" name="required_skills" class="form-control saas-input border" style="border-color: var(--border-color) !important;"
                   value="{{ job.required_skills }}" required>
            <small class="text-muted d-block mt-2">Separate skills with commas — the AI matches candidates against these</small>
          </div>
        </div>

        <div class="ats-form-footer">
          <a href="{{ url_for('recruiter.recruiter_dashboard') }}" class="saas-btn-secondary text-decoration-none py-2">
            Cancel
          </a>
          <button type="submit" class="saas-btn-primary px-4 py-2">
            <i class="bi bi-check-circle me-1"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
