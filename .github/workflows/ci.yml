name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Ruff Linting
      run: |
        ruff check .

    - name: Run Black Formatting Check
      run: |
        black --check .

    - name: Syntax validation
      run: |
        # Use compileall to statically validate all project Python files
        python -m compileall -q app.py core.py config.py routes/ services/ models/

    - name: Run pytest (Unit tests)
      env:
        FLASK_SECRET_KEY: dummy-ci-secret
      run: |
        pytest -v tests/ \
          --ignore=tests/test_schema_contract.py \
          --ignore=tests/test_phase4a.py

    - name: Run Schema Integration Test (Fresh Schema)
      env:
        TEST_DB_HOST: 127.0.0.1
        TEST_DB_USER: root
        TEST_DB_PASSWORD: root
        TEST_DB_NAME: test_db
      run: |
        mysql -h 127.0.0.1 -u root -proot test_db < database/schema.sql
        pytest -v tests/test_schema_contract.py

    - name: Run Phase 4A DB Integration Tests
      env:
        FLASK_SECRET_KEY: dummy-ci-secret
        TESTING: "True"
        MYSQL_HOST: 127.0.0.1
        MYSQL_PORT: "3306"
        MYSQL_USER: root
        MYSQL_PASSWORD: root
        MYSQL_DB: test_db
        MYSQL_SSL: "False"
      run: |
        pytest -v tests/test_phase4a.py

    - name: Run Schema Integration Test (Migration Path & Backfill)
      env:
        TEST_DB_HOST: 127.0.0.1
        TEST_DB_USER: root
        TEST_DB_PASSWORD: root
        TEST_DB_NAME: test_db
      run: |
        # Reset database
        mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE test_db; CREATE DATABASE test_db;"
        
        # Load pre-repair Phase 1B schema from fixture
        mysql -h 127.0.0.1 -u root -proot test_db < tests/fixtures/pre_003_004_schema.sql
        
        # Insert safe dummy existing records
        mysql -h 127.0.0.1 -u root -proot test_db -e "INSERT INTO users (id, name, email, password, role) VALUES (1, 'Test User', 'test@example.com', 'hash', 'candidate');"
        mysql -h 127.0.0.1 -u root -proot test_db -e "INSERT INTO jobs (id, recruiter_id, job_title, required_skills, description, location) VALUES (1, 1, 'Title', 'skill', 'Desc', 'Loc');"

        # Apply migrations
        mysql -h 127.0.0.1 -u root -proot test_db < database/migrations/003_reconcile_foundation.sql
        mysql -h 127.0.0.1 -u root -proot test_db < database/migrations/004_job_lifecycle.sql
        mysql -h 127.0.0.1 -u root -proot test_db < database/migrations/007_add_saved_jobs.sql
        mysql -h 127.0.0.1 -u root -proot test_db < database/migrations/008_add_withdrawn_status.sql

        # Verify backfill
        mysql -h 127.0.0.1 -u root -proot test_db -e "SELECT is_active, company_id FROM users WHERE id = 1;"
        mysql -h 127.0.0.1 -u root -proot test_db -e "SELECT is_active FROM jobs WHERE id = 1;"

        # Verify schema contract on migrated schema
        pytest -v tests/test_schema_contract.py

        # Dump schema metadata for manual review
        mysql -h 127.0.0.1 -u root -proot test_db -e "SELECT TABLE_NAME, COLUMN_NAME, CONSTRAINT_NAME, REFERENCED_TABLE_NAME, REFERENCED_COLUMN_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE WHERE REFERENCED_TABLE_SCHEMA = 'test_db' AND REFERENCED_TABLE_NAME IS NOT NULL;"

    - name: Run Schema Integration Test (Actual Production Drift & Reconciliation)
      env:
        TEST_DB_HOST: 127.0.0.1
        TEST_DB_USER: root
        TEST_DB_PASSWORD: root
        TEST_DB_NAME: test_db
      run: |
        # Reset database
        mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE test_db; CREATE DATABASE test_db;"
        
        # Load actual production drift schema from fixture
        mysql -h 127.0.0.1 -u root -proot test_db < tests/fixtures/current_production_drift_schema.sql
        
        # Insert safe dummy existing records including candidate profile with NULL is_active for job
        mysql -h 127.0.0.1 -u root -proot test_db -e "INSERT INTO users (id, name, email, password, role) VALUES (1, 'Test User', 'test@example.com', 'hash', 'candidate');"
        mysql -h 127.0.0.1 -u root -proot test_db -e "INSERT INTO jobs (id, recruiter_id, job_title, required_skills, description, location, is_active) VALUES (1, 1, 'Title', 'skill', 'Desc', 'Loc', NULL);"
        mysql -h 127.0.0.1 -u root -proot test_db -e "INSERT INTO candidate_profiles (user_id) VALUES (1);"

        # Apply migrations
        mysql -h 127.0.0.1 -u root -proot test_db < database/migrations/003_reconcile_foundation.sql
        mysql -h 127.0.0.1 -u root -proot test_db < database/migrations/005_reconcile_candidate_profile.sql
        mysql -h 127.0.0.1 -u root -proot test_db < database/migrations/006_reconcile_job_lifecycle.sql
        mysql -h 127.0.0.1 -u root -proot test_db < database/migrations/008_add_withdrawn_status.sql

        # Verify backfill
        mysql -h 127.0.0.1 -u root -proot test_db -e "SELECT is_active FROM jobs WHERE id = 1;" | grep -q "1"

        # Verify schema contract on migrated schema
        pytest -v tests/test_schema_contract.py
