name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run Ruff Linting
      run: |
        ruff check .

    - name: Run Black Formatting Check
      run: |
        black --check .

    - name: Syntax validation
      run: |
        # Use compileall to statically validate all project Python files
        python -m compileall -q app.py core.py config.py routes/ services/ models/

    - name: Run pytest
      env:
        FLASK_SECRET_KEY: dummy-ci-secret
      run: |
        pytest -v tests/

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Test Docker image build
      run: |
        # Only validates the Dockerfile builds successfully
        docker build -t recruitment-analytics-ci .
